[package]
name = "prowlet_registry"
version = "0.1.0"
description = "Privacy-preserving Merkle batch registry for Prowlet certificates"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "prowlet_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
solana-keccak-hasher = "2.2.1"

[dev-dependencies]
solana-keccak-hasher = { version = "2.2.1", features = ["sha3"] }
